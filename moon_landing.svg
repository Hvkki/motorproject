<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">1969 — Приземлення на Місяць (SVG фільм)</title>
  <desc id="desc">Кілька сцен: підліт лунного модуля, посадка, астронавти ходять і встановлюють прапор. Все намальовано та анімовано в SVG.</desc>
  <defs>
    <radialGradient id="gMoon" cx="50%" cy="10%" r="120%">
      <stop offset="0%" stop-color="#8f8f95"/>
      <stop offset="60%" stop-color="#6f6f75"/>
      <stop offset="100%" stop-color="#5a5a60"/>
    </radialGradient>
    <radialGradient id="gEarth" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4ec3ff"/>
      <stop offset="60%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#0b2b5a"/>
    </radialGradient>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59a"/>
      <stop offset="50%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      :root { --dur: 28s; }
      svg { background: #05060a; }

      /* Scene visibility windows */
      .scene-1 { animation: scene1 var(--dur) steps(1, end) infinite; }
      .scene-2 { animation: scene2 var(--dur) steps(1, end) infinite; }
      .scene-3 { animation: scene3 var(--dur) steps(1, end) infinite; }
      @keyframes scene1 { 0%, 28.57% { opacity: 1 } 28.58%, 100% { opacity: 0 } }
      @keyframes scene2 { 0%, 28.57% { opacity: 0 } 28.58%, 53.57% { opacity: 1 } 53.58%, 100% { opacity: 0 } }
      @keyframes scene3 { 0%, 53.57% { opacity: 0 } 53.58%, 100% { opacity: 1 } }

      /* Stars */
      .stars circle { fill: #d7e3ff; opacity: 0.85; }
      .stars circle:nth-child(3n) { opacity: 0.6; }
      .stars circle:nth-child(5n) { opacity: 0.35; }
      .stars circle { animation: twinkle 4.2s ease-in-out infinite; }
      .stars circle:nth-child(5n+1) { animation-duration: 3.6s; animation-delay: .4s; }
      .stars circle:nth-child(5n+2) { animation-duration: 5s; animation-delay: 1.1s; }
      .stars circle:nth-child(5n+3) { animation-duration: 4.6s; animation-delay: .8s; }
      .stars circle:nth-child(5n+4) { animation-duration: 3.2s; animation-delay: 1.6s; }
      .stars circle:nth-child(5n+5) { animation-duration: 6s; animation-delay: .2s; }
      @keyframes twinkle { 0%, 100% { opacity: .85 } 50% { opacity: .2 } }

      /* Earth */
      .earth-group { transform-box: fill-box; transform-origin: center; animation: earthRotate calc(var(--dur) * 2) linear infinite; }
      @keyframes earthRotate { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }

      /* LEM movement across full timeline (only visible in scene 1+2) */
      .lem { transform-box: fill-box; transform-origin: center; animation: lemMove var(--dur) linear infinite; }
      @keyframes lemMove {
        0% { transform: translate(420px, -260px) scale(.75) rotate(-12deg); }
        20% { transform: translate(120px, -80px) scale(.9) rotate(-6deg); }
        28.57% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
        53.57% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
        100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      }
      .flame { transform-box: fill-box; transform-origin: top center; animation: flameFlicker var(--dur) linear infinite; }
      @keyframes flameFlicker {
        0% { opacity: .95; transform: translateY(4px) scaleY(1); }
        8% { opacity: .6; transform: translateY(10px) scaleY(.7); }
        16% { opacity: .9; transform: translateY(2px) scaleY(1); }
        24% { opacity: .5; transform: translateY(12px) scaleY(.6); }
        28.57% { opacity: .9; transform: translateY(2px) scaleY(1); }
        40% { opacity: 0; transform: translateY(14px) scaleY(.5); }
        100% { opacity: 0; transform: translateY(14px) scaleY(.5); }
      }

      /* Dust puff near touchdown */
      .dust { opacity: 0; transform-box: fill-box; transform-origin: center; animation: dustPuff var(--dur) ease-out infinite; }
      @keyframes dustPuff {
        0%, 25% { opacity: 0; transform: translateY(8px) scale(.7); }
        28% { opacity: .9; transform: translateY(0) scale(1); }
        34% { opacity: .4; transform: translateY(-8px) scale(1.2); }
        40% { opacity: 0; transform: translateY(-16px) scale(1.35); }
        100% { opacity: 0; transform: translateY(-16px) scale(1.35); }
      }

      /* Astronaut movement (only visible in scene 3) */
      .astronaut { transform-box: fill-box; transform-origin: center; animation: astroPos var(--dur) ease-in-out infinite; }
      @keyframes astroPos {
        0%, 53.57% { transform: translate(0px, 0px); }
        70% { transform: translate(160px, -2px); }
        100% { transform: translate(240px, 0px); }
      }
      .leg-left, .leg-right { transform-box: fill-box; transform-origin: top center; }
      .leg-left { animation: legLeft var(--dur) ease-in-out infinite; }
      .leg-right { animation: legRight var(--dur) ease-in-out infinite; }
      @keyframes legLeft {
        0%, 53.57% { transform: rotate(0deg); }
        58% { transform: rotate(10deg); }
        62% { transform: rotate(-6deg); }
        66% { transform: rotate(12deg); }
        70% { transform: rotate(-8deg); }
        74% { transform: rotate(10deg); }
        78% { transform: rotate(-6deg); }
        82% { transform: rotate(10deg); }
        86% { transform: rotate(-6deg); }
        92% { transform: rotate(6deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes legRight {
        0%, 53.57% { transform: rotate(0deg); }
        58% { transform: rotate(-6deg); }
        62% { transform: rotate(12deg); }
        66% { transform: rotate(-6deg); }
        70% { transform: rotate(10deg); }
        74% { transform: rotate(-8deg); }
        78% { transform: rotate(12deg); }
        82% { transform: rotate(-6deg); }
        86% { transform: rotate(10deg); }
        92% { transform: rotate(-6deg); }
        100% { transform: rotate(0deg); }
      }

      /* Flag */
      .flag { opacity: 0; animation: flagAppear var(--dur) linear infinite; }
      @keyframes flagAppear { 0%, 58% { opacity: 0 } 60%, 100% { opacity: 1 } }
      .flag .cloth { transform-box: fill-box; transform-origin: left center; animation: flagWave 2.8s ease-in-out infinite; }
      @keyframes flagWave { 0% { transform: skewY(0deg) scaleX(1) } 50% { transform: skewY(4deg) scaleX(1.03) } 100% { transform: skewY(0deg) scaleX(1) } }

      /* Captions */
      .title { fill: #ffffff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: 0; animation: titleAnim var(--dur) linear infinite; }
      .subtitle-2 { fill: #ffffff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; font-weight: 600; opacity: 0; animation: subtitle2 var(--dur) linear infinite; }
      .subtitle-3 { fill: #ffffff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; font-weight: 600; opacity: 0; animation: subtitle3 var(--dur) linear infinite; }
      @keyframes titleAnim { 0% { opacity: 0; transform: translateY(10px) } 5% { opacity: 1; transform: translateY(0) } 15% { opacity: 1 } 22% { opacity: 0 } 100% { opacity: 0 } }
      @keyframes subtitle2 { 0%, 26% { opacity: 0 } 30% { opacity: 1 } 45% { opacity: 1 } 52% { opacity: 0 } 100% { opacity: 0 } }
      @keyframes subtitle3 { 0%, 53% { opacity: 0 } 58% { opacity: 1 } 95% { opacity: 1 } 100% { opacity: 0 } }

      /* General shapes */
      .ground { fill: url(#gMoon); }
      .crater { fill: #4e4e54; opacity: .9; filter: url(#softBlur); }
      .crater-shadow { fill: #3f3f46; opacity: .5; filter: url(#softBlur); }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <!-- Background stars -->
  <g class="stars" aria-hidden="true">
    <circle cx="80" cy="70" r="1.8"/>
    <circle cx="160" cy="150" r="1.2"/>
    <circle cx="220" cy="50" r="1.5"/>
    <circle cx="320" cy="110" r="1.1"/>
    <circle cx="420" cy="40" r="1.6"/>
    <circle cx="540" cy="80" r="1.3"/>
    <circle cx="620" cy="30" r="1.8"/>
    <circle cx="700" cy="90" r="1.4"/>
    <circle cx="780" cy="40" r="1.7"/>
    <circle cx="860" cy="120" r="1.3"/>
    <circle cx="940" cy="70" r="1.1"/>
    <circle cx="1040" cy="90" r="1.5"/>
    <circle cx="1120" cy="50" r="1.7"/>
    <circle cx="1160" cy="150" r="1.2"/>

    <circle cx="60" cy="240" r="1.1"/>
    <circle cx="140" cy="300" r="1.6"/>
    <circle cx="220" cy="260" r="1.3"/>
    <circle cx="300" cy="200" r="1.2"/>
    <circle cx="380" cy="250" r="1.8"/>
    <circle cx="460" cy="210" r="1.1"/>
    <circle cx="540" cy="260" r="1.4"/>
    <circle cx="620" cy="200" r="1.3"/>
    <circle cx="700" cy="240" r="1.2"/>
    <circle cx="780" cy="210" r="1.6"/>
    <circle cx="860" cy="250" r="1.3"/>
    <circle cx="940" cy="220" r="1.4"/>
    <circle cx="1020" cy="240" r="1.5"/>
    <circle cx="1100" cy="220" r="1.2"/>

    <circle cx="120" cy="380" r="1.3"/>
    <circle cx="200" cy="340" r="1.4"/>
    <circle cx="280" cy="410" r="1.7"/>
    <circle cx="360" cy="360" r="1.1"/>
    <circle cx="440" cy="410" r="1.6"/>
    <circle cx="520" cy="360" r="1.2"/>
    <circle cx="600" cy="400" r="1.3"/>
    <circle cx="680" cy="360" r="1.2"/>
    <circle cx="760" cy="380" r="1.5"/>
    <circle cx="840" cy="420" r="1.1"/>
    <circle cx="920" cy="360" r="1.6"/>
    <circle cx="1000" cy="420" r="1.2"/>
    <circle cx="1080" cy="380" r="1.5"/>
    <circle cx="1160" cy="360" r="1.3"/>

    <circle cx="140" cy="520" r="1.2"/>
    <circle cx="220" cy="560" r="1.4"/>
    <circle cx="300" cy="520" r="1.6"/>
    <circle cx="380" cy="560" r="1.2"/>
    <circle cx="460" cy="540" r="1.1"/>
    <circle cx="540" cy="520" r="1.4"/>
    <circle cx="620" cy="560" r="1.2"/>
    <circle cx="700" cy="520" r="1.3"/>
    <circle cx="780" cy="560" r="1.2"/>
    <circle cx="860" cy="520" r="1.4"/>
    <circle cx="940" cy="560" r="1.1"/>
    <circle cx="1020" cy="540" r="1.6"/>
    <circle cx="1100" cy="520" r="1.3"/>
  </g>

  <!-- Earth -->
  <g class="earth-group" transform="translate(170,120)">
    <circle r="64" fill="url(#gEarth)" filter="url(#glow)"/>
    <g fill="#3cd671" opacity=".9">
      <path d="M-25,-30c20,-10 40,-10 55,5c10,10 8,20 -10,30c-20,10 -40,10 -55,-5c-10,-10 -8,-20 10,-30z"/>
      <path d="M-50,10c15,-8 30,-8 40,4c7,8 6,15 -7,22c-15,8 -30,8 -40,-4c-7,-8 -6,-15 7,-22z"/>
      <path d="M0,35c8,-5 16,-5 22,2c4,5 3,9 -4,13c-8,5 -16,5 -22,-2c-4,-5 -3,-9 4,-13z"/>
    </g>
  </g>

  <!-- Ground (Moon surface) -->
  <path class="ground" d="M0,520 C180,500 360,520 540,510 C720,500 900,520 1200,500 L1200,675 L0,675 Z"/>

  <!-- Craters -->
  <g opacity=".9">
    <ellipse class="crater" cx="220" cy="560" rx="80" ry="18"/>
    <ellipse class="crater-shadow" cx="220" cy="560" rx="50" ry="10"/>
    <ellipse class="crater" cx="520" cy="545" rx="70" ry="16"/>
    <ellipse class="crater-shadow" cx="520" cy="545" rx="44" ry="9"/>
    <ellipse class="crater" cx="860" cy="560" rx="90" ry="20"/>
    <ellipse class="crater-shadow" cx="860" cy="560" rx="56" ry="12"/>
  </g>

  <!-- Titles / captions -->
  <text x="50%" y="70" text-anchor="middle" class="title" font-size="28">1969 — Приземлення на Місяць</text>
  <text x="50%" y="640" text-anchor="middle" class="subtitle-2" font-size="20">Сцена 2: Посадка</text>
  <text x="50%" y="640" text-anchor="middle" class="subtitle-3" font-size="20">Сцена 3: Перші кроки</text>

  <!-- LEM (Lunar Module) -->
  <g transform="translate(720,440)">
    <g class="lem scene-1 scene-2">
      <!-- Legs -->
      <g fill="#c7c9cc" stroke="#8a8d91" stroke-width="2">
        <line x1="-40" y1="10" x2="-90" y2="60"/>
        <ellipse cx="-95" cy="62" rx="16" ry="6" fill="#b9bcc0" stroke="none"/>
        <line x1="40" y1="10" x2="90" y2="60"/>
        <ellipse cx="95" cy="62" rx="16" ry="6" fill="#b9bcc0" stroke="none"/>
        <line x1="0" y1="10" x2="0" y2="72"/>
        <ellipse cx="0" cy="74" rx="18" ry="7" fill="#b9bcc0" stroke="none"/>
      </g>
      <!-- Body -->
      <g>
        <polygon points="-42,-10 42,-10 58,18 0,40 -58,18" fill="#f2d16b" stroke="#9a7f2a" stroke-width="2"/>
        <rect x="-24" y="-44" width="48" height="34" rx="6" fill="#dadde2" stroke="#8a8d91" stroke-width="2"/>
        <circle cx="0" cy="-28" r="8" fill="#4a6aff"/>
        <rect x="-6" y="42" width="12" height="10" fill="#8a8d91"/>
      </g>
      <!-- Engine flame (animated) -->
      <g class="flame">
        <polygon points="0,54 -10,90 0,110 10,90" fill="url(#gFlame)"/>
        <polygon points="0,60 -6,86 0,98 6,86" fill="#ffd65a" opacity=".8"/>
      </g>
    </g>
    <!-- Dust puff near landing -->
    <g class="dust scene-2" filter="url(#softBlur)">
      <ellipse cx="0" cy="78" rx="38" ry="10" fill="#c2c3c7" opacity=".6"/>
      <ellipse cx="-18" cy="80" rx="20" ry="6" fill="#c2c3c7" opacity=".5"/>
      <ellipse cx="18" cy="80" rx="20" ry="6" fill="#c2c3c7" opacity=".5"/>
    </g>
  </g>

  <!-- Astronauts and flag (appear in scene 3) -->
  <g transform="translate(720,450)">
    <g class="astronaut scene-3" transform="translate(-160,-10)">
      <!-- Backpack -->
      <rect x="-26" y="-44" width="18" height="24" rx="4" fill="#cfd3d8"/>
      <!-- Body -->
      <rect x="-24" y="-32" width="48" height="44" rx="10" fill="#e9ecf0" stroke="#b9bcc0" stroke-width="2"/>
      <!-- Helmet -->
      <circle cx="0" cy="-36" r="16" fill="#e9ecf0" stroke="#b9bcc0" stroke-width="2"/>
      <circle cx="0" cy="-36" r="10" fill="#2a2f3a"/>
      <!-- Arms -->
      <rect x="-42" y="-20" width="18" height="10" rx="4" fill="#e9ecf0"/>
      <rect x="24" y="-20" width="18" height="10" rx="4" fill="#e9ecf0"/>
      <!-- Legs -->
      <g class="leg-left">
        <rect x="-18" y="10" width="14" height="32" rx="5" fill="#e9ecf0"/>
        <rect x="-22" y="40" width="22" height="8" rx="3" fill="#d8dbdf"/>
      </g>
      <g class="leg-right">
        <rect x="4" y="10" width="14" height="32" rx="5" fill="#e9ecf0"/>
        <rect x="0" y="40" width="22" height="8" rx="3" fill="#d8dbdf"/>
      </g>
    </g>

    <!-- Flag -->
    <g class="flag scene-3" transform="translate(140,-20)">
      <rect x="0" y="-60" width="6" height="90" fill="#cfd3d8"/>
      <g class="cloth">
        <rect x="6" y="-58" width="90" height="24" fill="#d22"/>
        <rect x="6" y="-34" width="90" height="12" fill="#fff"/>
        <rect x="6" y="-22" width="90" height="12" fill="#1f5eff"/>
      </g>
    </g>

    <!-- Footprints (static marks along the path) -->
    <g class="scene-3" fill="#c2c3c7" opacity=".5">
      <ellipse cx="-140" cy="50" rx="12" ry="4"/>
      <ellipse cx="-120" cy="50" rx="12" ry="4"/>
      <ellipse cx="-100" cy="50" rx="12" ry="4"/>
      <ellipse cx="-80" cy="50" rx="12" ry="4"/>
      <ellipse cx="-60" cy="50" rx="12" ry="4"/>
      <ellipse cx="-40" cy="50" rx="12" ry="4"/>
      <ellipse cx="-20" cy="50" rx="12" ry="4"/>
      <ellipse cx="0" cy="50" rx="12" ry="4"/>
      <ellipse cx="20" cy="50" rx="12" ry="4"/>
      <ellipse cx="40" cy="50" rx="12" ry="4"/>
      <ellipse cx="60" cy="50" rx="12" ry="4"/>
      <ellipse cx="80" cy="50" rx="12" ry="4"/>
      <ellipse cx="100" cy="50" rx="12" ry="4"/>
      <ellipse cx="120" cy="50" rx="12" ry="4"/>
    </g>
  </g>

</svg>
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests and privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17: Gradle 8.14 does not run on JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The guard runs first and cheaply: a screen-content leak is the most
      # expensive mistake in this codebase, so fail fast on it.
      - name: Privacy guard self-test
        run: tools/privacy_guard.sh --self-test

      - name: Privacy guard
        run: tools/privacy_guard.sh

      # No Android SDK needed: :core is pure Kotlin/JVM by design, which is what
      # makes this gate fast enough to block every pull request on.
      - name: Core tests
        run: ./gradlew :core:test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
